name: deardays
description: "DearDays — Your life, your story. A personal life journal that turns daily moments into a beautifully written book."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend & Auth
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.1

  # Local Storage (Encrypted)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.4

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Voice Recording & Audio
  record: ^5.2.1
  just_audio: ^0.9.43
  speech_to_text: ^7.0.0

  # AI & Networking
  http: ^1.3.0
  dio: ^5.7.0

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.5

  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # App Info
  package_info_plus: ^8.2.1

  # Image processing
  image: ^4.5.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  share_plus: ^12.0.1
  url_launcher: ^6.2.5
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^8.5.0
  purchases_ui_flutter: ^8.5.0

  # Observability
  sentry_flutter: ^8.12.0
  posthog_flutter: ^4.7.1

  # Connectivity (platform-native)
  connectivity_plus: ^6.1.1

  # Icons
  cupertino_icons: ^1.0.8

# Build-time only: resolves analyzer conflict between hive_generator and
# riverpod_generator. Safe for release — analyzer is a dev dependency that
# doesn't ship in the final binary.
dependency_overrides:
  analyzer: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/onboarding/
    - assets/fonts/

  # Fonts loaded via google_fonts package at runtime
  # assets/fonts/ contains stub TTF files (Lato-Regular stand-ins) named to
  # match the Manrope and Newsreader variants used by the app.  GoogleFonts
  # finds them in the asset bundle and silently uses them as fallbacks in
  # widget tests (allowRuntimeFetching = false).  The glyphs differ from
  # production but layout geometry is stable.
