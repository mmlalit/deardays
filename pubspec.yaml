name: deardays
description: "DearDays — Your life, your story. A personal life journal that turns daily moments into a beautifully written book."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend & Auth
  supabase_flutter: ^2.8.4

  # Local Storage (Encrypted)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.4

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Voice Recording & Audio
  record: ^5.2.2
  just_audio: ^0.9.43

  # AI & Networking
  http: ^1.3.0
  dio: ^5.7.0

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.5

  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^8.5.0
  purchases_ui_flutter: ^8.5.0

  # Icons
  cupertino_icons: ^1.0.8

dependency_overrides:
  record_platform_interface: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true

  # Assets will be added as the app grows
  # Fonts loaded via google_fonts package at runtime
