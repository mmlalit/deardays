name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/ --fatal-infos=false --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test test/ --reporter expanded

      - name: Build web
        run: >
          flutter build web --release --base-href "/deardays/"
          --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          --dart-define=AI_API_URL=${{ secrets.STAGING_AI_API_URL }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          --dart-define=POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          --dart-define=CDN_BASE_URL=${{ secrets.CDN_BASE_URL }}
          --dart-define=APP_ENV=staging

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
