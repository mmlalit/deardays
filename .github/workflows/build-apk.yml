name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Run widget & unit tests first — fast feedback, no emulator needed
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run all tests
        run: flutter test test/ --reporter expanded
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Build APK only if tests pass
  # ─────────────────────────────────────────────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Add Android platform
        run: flutter create --platforms android .

      - name: Set minSdkVersion to 24
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle

      - name: Add speech recognition permission
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=AI_API_URL=${{ secrets.AI_API_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deardays-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
