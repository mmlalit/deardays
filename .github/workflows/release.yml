name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=AI_API_URL=${{ secrets.PROD_AI_API_URL }} \
            --dart-define=REVENUECAT_GOOGLE_KEY=${{ secrets.PROD_REVENUECAT_GOOGLE_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=POSTHOG_HOST=${{ secrets.POSTHOG_HOST }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=AI_API_URL=${{ secrets.PROD_AI_API_URL }} \
            --dart-define=REVENUECAT_GOOGLE_KEY=${{ secrets.PROD_REVENUECAT_GOOGLE_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=POSTHOG_HOST=${{ secrets.POSTHOG_HOST }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign for CI)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=AI_API_URL=${{ secrets.PROD_AI_API_URL }} \
            --dart-define=REVENUECAT_APPLE_KEY=${{ secrets.PROD_REVENUECAT_APPLE_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=POSTHOG_HOST=${{ secrets.POSTHOG_HOST }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
